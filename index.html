<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <!-- Favicon & Iconografía -->
  <link rel="icon" type="image/svg+xml" href="/escudo_nyg.svg" />
  <link rel="icon" type="image/png" href="/escudo_nyg.png" />
  <link rel="apple-touch-icon" href="/escudo_nyg.png" />

  <!-- Viewport para Responsive & Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

  <!-- Configuración PWA / Theme -->
  <meta name="theme-color" content="#002b5c" /> <!-- nyg-blue -->

  <!-- Preconnect y Preload para Optimización de Velocidad -->
  <!-- Preconnect a Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Preconnect al Backend de Render para acelerar las peticiones API -->
  <link rel="preconnect" href="https://nyg-losblancos.onrender.com" crossorigin />
  <link rel="dns-prefetch" href="https://nyg-losblancos.onrender.com" />

  <!-- Preload de Fuente Inter (crítico para First Contentful Paint) -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />

  <!-- Preload de Hero Image (crítico para Largest Contentful Paint) -->
  <link rel="preload" as="image" href="/img-club1.png" />

  <!-- Metadatos Básicos SEO -->
  <title>Club Natación y Gimnasia | Sitio Oficial</title>
  <meta name="description"
    content="Sitio oficial del Club Natación y Gimnasia. Todo sobre nuestro club, noticias, fixture, resultados, rugby infantil, plantel superior y hockey." />
  <meta name="keywords"
    content="rugby, hockey, tucuman, natacion y gimnasia, club natacion y gimnasia, plantel superior, infantiles, juveniles, deportes, torneo regional" />
  <meta name="author" content="Club Natación y Gimnasia" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical Tag (Previene contenido duplicado en SEO) -->
  <link rel="canonical" href="https://natacionygimanacia.vercel.app/" />

  <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Club Natación y Gimnasia" />
  <meta property="og:description"
    content="Sitio oficial del Club Natación y Gimnasia. Acompañá a nuestros equipos en cada partido. ¡Sumate a la familia de los Blancos!" />
  <meta property="og:image" content="https://natacionygimanacia.vercel.app/escudo_nyg.png" />
  <meta property="og:url" content="https://natacionygimanacia.vercel.app/" />
  <meta property="og:site_name" content="Club Natación y Gimnasia" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Club Natación y Gimnasia" />
  <meta name="twitter:description"
    content="Sitio oficial del Club Natación y Gimnasia. Acompañá a nuestros equipos en cada partido. ¡Sumate a la familia de los Blancos!" />
  <meta name="twitter:image" content="https://natacionygimanacia.vercel.app/escudo_nyg.png" />
</head>

<body>
  <!-- Manejo para SEO de lectores lentos (No JS fallback) -->
  <noscript>
    <div style="padding: 2rem; text-align: center; font-family: sans-serif;">
      Necesitas activar JavaScript para navegar en el sitio oficial del Club Natación y Gimnasia.
    </div>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
